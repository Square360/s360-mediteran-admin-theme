name: S360 Mediteran
type: theme
description: 'Square360 modifications to Mediteran'
package: Other
core_version_requirement: ^9 || ^10
base theme: mediteran

dependencies:
  - admin_toolbar:admin_toolbar
  - admin_toolbar:admin_toolbar_tools
  - admin_toolbar_mediteran:admin_toolbar_mediteran

libraries:
  - s360_mediteran/s360_mediteran.admin

libraries-override:
  smart_date/smart_date:
    css:
      component:
        css/smart_date.css: false
  mediteran/media-library:
    css:
      layout:
        css/media-library/media-library.css: false

regions:
  header: 'Header'
  pre_content: 'Pre-content'
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  help: Help
  content: Content
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  sidebar_first: 'First sidebar'

screenshot: images/s360-mediteran.png
